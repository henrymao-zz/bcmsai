name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target: [BCM56371, TD3X]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: |
          cmake -S . -B build \
            -DSAI_BCM_TARGET=${{ matrix.target }} \
            -DSAI_BCM_BACKEND=mock \
            -DSA_BCM_BUILD_OPENBCM=OFF

      - name: Build
        run: cmake --build build

      - name: Unit tests (mock backend)
        run: |
          ./build/test_oid
          ./build/test_switch
          ./build/test_port
          ./build/test_l2
          ./build/test_l3

      - name: Smoke test
        run: ./build/smoke_load ./build/libsai.so

      - name: ctest
        run: ctest --test-dir build --output-on-failure

      - name: Exported-symbol hygiene
        run: |
          set -e
          got=$(nm -D --defined-only build/libsai.so | awk '{print $3}' \
                | sed 's/@.*//' | grep -E '^sai_' | sort -u)
          want=$(printf '%s\n' \
            sai_api_initialize sai_api_query sai_api_uninitialize \
            sai_log_set sai_object_type_query sai_switch_id_query \
            sai_dbg_generate_dump sai_object_type_get_availability | sort -u)
          diff <(printf '%s\n' "${want}") <(printf '%s\n' "${got}")

      - name: No backend symbols leak into the dynamic table
        run: |
          test "$(nm -D build/libsai.so | grep -cE ' (bcm_|_shr_)' || true)" -eq 0